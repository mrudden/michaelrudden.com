<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC & SC Alumni Map</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f1923;
    color: #e8e6e1;
    min-height: 100vh;
  }

  .header {
    padding: 24px 40px 18px;
    background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 100%);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .header .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.45);
    margin-top: 4px;
    font-weight: 400;
  }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-circle {
    border-radius: 50%;
    border: 2px solid;
    opacity: 0.8;
  }

  .stats-bar {
    display: flex;
    gap: 32px;
    padding: 12px 40px;
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 13px;
    align-items: center;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }

  .stat-label {
    color: rgba(255,255,255,0.4);
    font-weight: 500;
  }

  .controls-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .controls-group-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.3);
    margin-right: 4px;
    font-weight: 600;
  }

  .filter-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.12);
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover {
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }

  .filter-btn.active {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.25);
    color: #fff;
  }

  .separator {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,0.1);
    margin: 0 8px;
  }

  #map {
    width: 100%;
    height: calc(100vh - 130px);
  }

  .leaflet-popup-content-wrapper {
    background: #1a2a3a !important;
    color: #e8e6e1 !important;
    border-radius: 12px !important;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5) !important;
    border: 1px solid rgba(255,255,255,0.08) !important;
    padding: 0 !important;
  }

  .leaflet-popup-tip {
    background: #1a2a3a !important;
    border: 1px solid rgba(255,255,255,0.08) !important;
    border-top: none !important;
    border-left: none !important;
  }

  .leaflet-popup-content {
    margin: 0 !important;
    min-width: 200px !important;
    max-width: 300px !important;
  }

  .popup-inner {
    padding: 16px 20px;
  }

  .popup-city {
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    margin-bottom: 2px;
  }

  .popup-state {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .popup-count {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }

  .popup-count-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .popup-bar {
    margin-top: 10px;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .popup-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .popup-cities-list {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
    max-height: 200px;
    overflow-y: auto;
  }

  .popup-cities-list::-webkit-scrollbar {
    width: 4px;
  }
  .popup-cities-list::-webkit-scrollbar-track {
    background: transparent;
  }
  .popup-cities-list::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
  }

  .popup-city-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 3px 0;
    font-size: 12px;
  }

  .popup-city-name {
    color: rgba(255,255,255,0.7);
  }

  .popup-city-count {
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    min-width: 28px;
    text-align: right;
  }

  .popup-top-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .popup-metro-type {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }

  .leaflet-container {
    background: #0f1923 !important;
  }

  .info-panel {
    position: absolute;
    bottom: 24px;
    left: 24px;
    z-index: 1000;
    background: rgba(26, 42, 58, 0.92);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    max-width: 240px;
    line-height: 1.5;
  }

  .leaflet-control-zoom a {
    background: #1a2a3a !important;
    color: #e8e6e1 !important;
    border-color: rgba(255,255,255,0.1) !important;
  }

  .leaflet-control-zoom a:hover {
    background: #253a4e !important;
  }

  @media (max-width: 768px) {
    .header { padding: 16px 20px; }
    .header h1 { font-size: 22px; }
    .stats-bar { padding: 10px 20px; gap: 16px; }
    .info-panel { display: none; }
    .separator { display: none; }
    .controls-row { gap: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Alumni Distribution</h1>
    <div class="subtitle">North Carolina & South Carolina</div>
  </div>
  <div class="controls-row">
    <div class="controls-group">
      <span class="controls-group-label">View</span>
      <button class="filter-btn active" data-view="cities">Cities</button>
      <button class="filter-btn" data-view="metro">Metro Areas</button>
    </div>
    <div class="separator"></div>
    <div class="controls-group">

      <button class="filter-btn state-btn active" data-filter="all">All</button>
      <button class="filter-btn state-btn" data-filter="NC">NC</button>
      <button class="filter-btn state-btn" data-filter="SC">SC</button>

  </div>
</div>

  <div class="legend" style="margin-left:auto;">

    <div class="legend-item">

      <span>Cross-state</span>
    </div>
  </div>
</div>

<div id="map"></div>

<div class="info-panel" id="info-panel">

// ─── BUILD METRO AGGREGATES ──────────────────────────────────────────
function buildMetroData() {
  const metros = {};
  const unmapped = [];

  rows.forEach(r => {
    const key = `${r.city},${r.state}`;
    const metro = cityToMetro[key];
    if (metro) {
      if (!metros[metro]) {
        metros[metro] = { name: metro, count: 0, cities: [], states: new Set(), info: metroInfo[metro] };
      }
      metros[metro].count += r.count;
      metros[metro].cities.push({ city: r.city, state: r.state, count: r.count });
      metros[metro].states.add(r.state);
    } else {
      unmapped.push(r);
    }
  });

  // Sort cities within each metro by count
  Object.values(metros).forEach(m => {
    m.cities.sort((a, b) => b.count - a.count);
    m.statesArr = Array.from(m.states);
  });

  return { metros, unmapped };
}

const { metros, unmapped } = buildMetroData();

  const minR = 5, maxR = 45;
  return minR + (maxR - minR) * Math.sqrt(count / maxCount);

  if (statesArr.length > 1) return '167,139,250'; // purple for cross-state
  return statesArr[0] === 'NC' ? '99,179,237' : '251,191,36';
}

function makeCityPopup(r, maxCount) {
  const color = r.state === 'NC' ? '#63b3ed' : '#fbbf24';
  const pct = ((r.count / maxCount) * 100).toFixed(0);
  return `<div class="popup-inner">
    <div class="popup-city">${r.city}</div>
    <div class="popup-state">${r.state === 'NC' ? 'North Carolina' : 'South Carolina'}</div>
    <div class="popup-count" style="color:${color}">${r.count}</div>
    <div class="popup-count-label">alumni</div>
    <div class="popup-bar"><div class="popup-bar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

function makeMetroPopup(metro, maxCount) {
  const rgb = getMetroColor(metro.statesArr);
  const hexColor = metro.statesArr.length > 1 ? '#a78bfa'
    : metro.statesArr[0] === 'NC' ? '#63b3ed' : '#fbbf24';
  const pct = ((metro.count / maxCount) * 100).toFixed(0);
  const stateLabel = metro.statesArr.map(s => s === 'NC' ? 'North Carolina' : 'South Carolina').join(' & ');

  let citiesList = '';
  const showCities = metro.cities.slice(0, 12);
  const remaining = metro.cities.length - showCities.length;

  showCities.forEach(c => {
    citiesList += `<div class="popup-city-row">
      <span class="popup-city-name">${c.city}, ${c.state}</span>
      <span class="popup-city-count">${c.count}</span>
    </div>`;
  });
  if (remaining > 0) {
    citiesList += `<div class="popup-city-row"><span class="popup-city-name" style="font-style:italic;">+${remaining} more</span><span class="popup-city-count"></span></div>`;
  }

  return `<div class="popup-inner">
    <div class="popup-metro-type">Combined Statistical Area</div>
    <div class="popup-city">${metro.name}</div>
    <div class="popup-state">${stateLabel}</div>
    <div class="popup-count" style="color:${hexColor}">${metro.count}</div>
    <div class="popup-count-label">alumni across ${metro.cities.length} cities</div>
    <div class="popup-bar"><div class="popup-bar-fill" style="width:${pct}%;background:${hexColor}"></div></div>
    <div class="popup-cities-list">
      <div class="popup-top-label">Top cities</div>
      ${citiesList}
    </div>
  </div>`;
}

function renderCities(filter) {
  clearMarkers();
  const filtered = filter === 'all' ? rows : rows.filter(r => r.state === filter);
  const maxCount = Math.max(...filtered.map(r => r.count));
  const sorted = [...filtered].sort((a, b) => b.count - a.count);

  sorted.forEach(r => {
    const key = `${r.city},${r.state}`;
    const coords = geocode[key];
    if (!coords) return;

    const rgb = getStateColor(r.state);
    const radius = getRadius(r.count, maxCount);

    const circle = L.circleMarker([coords[0], coords[1]], {
      radius,
      fillColor: `rgba(${rgb},0.35)`,
      color: `rgba(${rgb},0.7)`,
      weight: 2,
      fillOpacity: 0.6,
    }).addTo(map);

    circle.bindPopup(makeCityPopup(r, maxCount), { closeButton: false, offset: [0, -5] });
    circle.on('mouseover', function() {
      this.setStyle({ fillOpacity: 0.85, weight: 3, color: `rgba(${rgb},1)` });
      this.openPopup();
    });
    circle.on('mouseout', function() {
      this.setStyle({ fillOpacity: 0.6, weight: 2, color: `rgba(${rgb},0.7)` });
      this.closePopup();
    });
    circle.on('click', function(e) { map.setView(e.latlng, map.getZoom() + 2); });

    if (r.count >= 10) {
      const label = L.divIcon({
        className: '',
        html: `<div style="color:#fff;font-family:'DM Sans',sans-serif;font-size:${r.count>=30?13:11}px;font-weight:700;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,0.8);pointer-events:none;white-space:nowrap;">${r.count}</div>`,
        iconSize: [40, 20], iconAnchor: [20, 10],
      });
      currentMarkers.push(L.marker([coords[0], coords[1]], { icon: label, interactive: false }).addTo(map));
    }

    currentMarkers.push(circle);
  });

  document.getElementById('city-count').textContent = filtered.length;
  document.getElementById('city-label').textContent = 'cities';
}

function renderMetros(filter) {
  clearMarkers();

  // Collect all items to render (metros + unmapped standalone cities)
  let items = [];

  Object.values(metros).forEach(metro => {
    // Filter by state
    if (filter !== 'all') {
      const filteredCities = metro.cities.filter(c => c.state === filter);
      if (filteredCities.length === 0) return;
      const filteredMetro = {
        ...metro,
        count: filteredCities.reduce((s, c) => s + c.count, 0),
        cities: filteredCities,
        statesArr: [filter],
      };
      items.push({ type: 'metro', data: filteredMetro });
    } else {
      items.push({ type: 'metro', data: metro });
    }
  });

  // Add unmapped cities as individual dots
  const filteredUnmapped = filter === 'all' ? unmapped : unmapped.filter(r => r.state === filter);
  filteredUnmapped.forEach(r => items.push({ type: 'city', data: r }));

  const allCounts = items.map(i => i.type === 'metro' ? i.data.count : i.data.count);
  const maxCount = Math.max(...allCounts, 1);

  // Sort largest first for z-order
  items.sort((a, b) => {
    const ca = a.type === 'metro' ? a.data.count : a.data.count;
    const cb = b.type === 'metro' ? b.data.count : b.data.count;
    return cb - ca;
  });

  let metroCount = 0;

  items.forEach(item => {
    if (item.type === 'metro') {
      metroCount++;
      const metro = item.data;
      const info = metro.info || metroInfo[metro.name];
      if (!info) return;

      const rgb = getMetroColor(metro.statesArr);
      const radius = getRadius(metro.count, maxCount);

      const circle = L.circleMarker([info.lat, info.lng], {
        radius,
        fillColor: `rgba(${rgb},0.3)`,
        color: `rgba(${rgb},0.65)`,
        weight: 2.5,
        fillOpacity: 0.55,
      }).addTo(map);

      circle.bindPopup(makeMetroPopup(metro, maxCount), { closeButton: false, offset: [0, -5], maxWidth: 280 });
      circle.on('mouseover', function() {
        this.setStyle({ fillOpacity: 0.8, weight: 3.5, color: `rgba(${rgb},1)` });
        this.openPopup();
      });
      circle.on('mouseout', function() {
        this.setStyle({ fillOpacity: 0.55, weight: 2.5, color: `rgba(${rgb},0.65)` });
        this.closePopup();
      });
      circle.on('click', function(e) { map.setView(e.latlng, map.getZoom() + 2); });

      // Label for metros with 8+ alumni
      if (metro.count >= 8) {
        const shortName = metro.name.split('-')[0].split(',')[0];
        const label = L.divIcon({
          className: '',
          html: `<div style="color:#fff;font-family:'DM Sans',sans-serif;font-size:${metro.count>=50?14:12}px;font-weight:700;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,0.9);pointer-events:none;white-space:nowrap;line-height:1.2;">
            ${metro.count}<br><span style="font-size:9px;font-weight:500;opacity:0.7;">${shortName}</span>
          </div>`,
          iconSize: [100, 36], iconAnchor: [50, 18],
        });
        currentMarkers.push(L.marker([info.lat, info.lng], { icon: label, interactive: false }).addTo(map));
      }

      currentMarkers.push(circle);
    } else {
      // Standalone unmapped city
      const r = item.data;
      const key = `${r.city},${r.state}`;
      const coords = geocode[key];
      if (!coords) return;

      const rgb = getStateColor(r.state);
      const radius = getRadius(r.count, maxCount);

      const circle = L.circleMarker([coords[0], coords[1]], {
        radius: Math.max(radius, 4),
        fillColor: `rgba(${rgb},0.25)`,
        color: `rgba(${rgb},0.5)`,
        weight: 1.5,
        fillOpacity: 0.45,
      }).addTo(map);

      circle.bindPopup(makeCityPopup(r, maxCount), { closeButton: false, offset: [0, -5] });
      circle.on('mouseover', function() {
        this.setStyle({ fillOpacity: 0.75, weight: 2.5, color: `rgba(${rgb},0.9)` });
        this.openPopup();
      });
      circle.on('mouseout', function() {
        this.setStyle({ fillOpacity: 0.45, weight: 1.5, color: `rgba(${rgb},0.5)` });
        this.closePopup();
      });

      currentMarkers.push(circle);
    }
  });

  document.getElementById('city-count').textContent = metroCount + filteredUnmapped.length;
  document.getElementById('city-label').textContent = 'metro areas & cities';
}

function render() {
  if (currentView === 'cities') {
    renderCities(currentFilter);
    document.getElementById('legend-mixed').style.display = 'none';
  } else {
    renderMetros(currentFilter);
    document.getElementById('legend-mixed').style.display = currentFilter === 'all' ? 'flex' : 'none';
  }
}

// Initial render
render();

// ─── EVENT LISTENERS ─────────────────────────────────────────────────
document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    render();
  });
});

document.querySelectorAll('.state-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});
</script>
</body>
</html>
